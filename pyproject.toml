[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-vcs",
  "hatchling",
]

[project]
name = "sensopy"
description = "Python library for the design and analysis of sensory discrimination tests."
readme = "README.md"
keywords = [
  "discrimination",
  "sensory",
  "triangle",
]
license = "MIT"
requires-python = ">=3.13"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dynamic = [
  "version",
]
dependencies = [
  "numpy>=2.2",
  "scipy>=1.15",
]
[[project.maintainers]]
name = "Edgar Ramírez-Mondragón"
email = "edgarrm358@gmail.com"
[[project.authors]]
name = "Edgar Ramírez-Mondragón"
email = "edgarrm358@gmail.com"
[project.urls]
Documentation = "https://sensopy.readthedocs.io/"
"Issue Tracker" = "https://github.com/edgarrmondragon/SensoPy/issues"
Releases = "https://github.com/edgarrmondragon/SensoPy/releases"
Source = "https://github.com/edgarrmondragon/SensoPy"

[dependency-groups]
dev = [
  { include-group = "docs" },
  { include-group = "tests" },
  { include-group = "typing" },
]
docs = [
  "matplotlib>=3.10",
  "zensical>=0.1",
]
tests = [
  "coverage[toml]>=7.13",
  "pytest>=9",
  "pytest-github-actions-annotate-failures>=0.4",
]
typing = [
  "mypy>=1.20",
  "scipy-stubs>=1",
  "ty>=0.0.27",
  { include-group = "docs" },
  { include-group = "tests" },
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.1.0.dev0"

[tool.ruff]
line-length = 120
preview = true
[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "B",
  "BLE",
  "C",
  "C4",
  "D",
  "DOC",
  "E",
  "ERA",
  "F",
  "FA",
  "FLY",
  "FURB",
  "I",
  "ICN",
  "ISC",
  "N",
  "NPY",
  "PERF",
  "PIE",
  "PT",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "TC",
  "UP",
  "W",
]
ignore = []
per-file-ignores."scripts/*" = [
  "ambiguous-unicode-character-string",
]
per-file-ignores."tests/*" = [
  "assert",
  "missing-return-type-undocumented-public-function",
]
unfixable = [
  "ERA",
]
flake8-annotations.allow-star-arg-any = true
flake8-annotations.mypy-init-return = true
flake8-annotations.suppress-dummy-args = true
pydocstyle.convention = "google"

[tool.pyproject-fmt]
max_supported_python = "3.15"
table_format = "long"

[tool.typos.default.extend-words]
# numpy
ND = "ND"  # e.g. NDArray
# Don't correct the AB/BA etc. sample labels
AB = "AB"
BA = "BA"

[tool.mypy]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]
strict = true
warn_unused_configs = true

[tool.pytest]
addopts = [
  "-ra",
  "-vvv",
  "--durations=3",
]
filterwarnings = [
  "error",
  "once:The iteration is not making good progress:RuntimeWarning",
]
log_level = "INFO"
minversion = "9"
strict = true
testpaths = [ "tests" ]

[tool.coverage.run]
source = [
  "sensopy",
]
branch = true
parallel = true
relative_files = true
[tool.coverage.paths]
package = [
  "src/sensopy/",
  "*/site-packages/sensopy/",
]
[tool.coverage.report]
fail_under = 90
exclude_also = [
  "@abstractmethod",
  "@abstractproperty",
  "if (t\\.)?TYPE_CHECKING:",
]
show_missing = true

[tool.tox]
requires = [
  "tox>=4.63",
  "tox-gh>=1.9",
  "tox-uv>=1",
]
env_list = [
  "coverage",
  { product = [
    { prefix = "3.", start = 13, stop = 15 },
  ] },
  "lowest",
  "type",
]
[tool.tox.env.coverage]
description = "combine coverage data and report"
skip_install = true
commands = [
  [ "coverage", "combine", "--debug=pathmap" ],
  [ "coverage", "report" ],
  [ "coverage", "xml" ],
]
depends = [ "3.*" ]
[tool.tox.env.docs]
description = "build the documentation"
dependency_groups = [ "docs" ]
commands = [
  [ "python", "scripts/generate_plots.py" ],
  [ "zensical", "build", "--clean" ],
]
[tool.tox.env.lowest]
description = "test lowest supported dependencies on Python {py_dot_ver}"
base_python = "3.13"
base_python_file = []
uv_resolution = "lowest-direct"
[tool.tox.env.type]
description = "type check with mypy"
dependency_groups = [ "typing" ]
commands = [
  [ "mypy", "src/sensopy", "tests" ],
  [ "ty", "check" ],
]
[tool.tox.env_run_base]
description = "run tests on Python {py_dot_ver}"
base_python_file = [ ".python-version" ]
pip_pre = true
dependency_groups = [ "tests" ]
commands = [
  [ "coverage", "run", "-m", "pytest", { replace = "posargs", extend = true, substitute = true } ],
]
[tool.tox.gh.python]
"3.15" = [ "type", "3.15" ]
"3.14" = [ "type", "3.14" ]
"3.13" = [ "type", "3.13", "lowest" ]
