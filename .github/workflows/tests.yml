name: Tests
on:
  pull_request: {}
  push:
    branches: [main]
  schedule:
  - cron: "0 0 * * 0" # every Sunday at midnight
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  build-package:
    name: Build & verify package
    runs-on: ubuntu-latest
    outputs:
      supported-python-versions: ${{ steps.baipp.outputs.supported_python_classifiers_json_array }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false
    - uses: hynek/build-and-inspect-python-package@v3.0.2
      id: baipp

  tests:
    name: Test
    runs-on: ubuntu-latest
    needs: build-package
    continue-on-error: false
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.build-package.outputs.supported-python-versions) }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Test
      run: uvx tox run
    - uses: actions/upload-artifact@v7.0.2
      with:
        include-hidden-files: true
        name: coverage-data-${{ matrix.python-version }}
        path: ".coverage.*"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
    - uses: actions/download-artifact@v8.0.2
      with:
        pattern: coverage-data-*
        merge-multiple: true
    - run: uvx tox run -e coverage
    - uses: codecov/codecov-action@v7.1.1
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      with:
        fail_ci_if_error: true
